name: Pickla Release V1 Stripe TEST read-only diagnosis
on:
  push:
    tags:
      - pickla-release-bootstrap-v1-checkout-form-diagnostic
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: pickla-release-certification
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm immutable trusted code and exact PR adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/tags/pickla-release-bootstrap-v1-checkout-form-diagnostic
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh pr view 4 --repo guggeuber/pickla-flow-1b995a61 --json headRefOid --jq .headRefOid)" = bf739011384f6343061e152a5b81f5b8dba74ada
          git fetch origin bf739011384f6343061e152a5b81f5b8dba74ada
          test "$(git rev-parse bf739011384f6343061e152a5b81f5b8dba74ada:scripts/release-isolated-db.mjs)" = "$(git hash-object scripts/release-isolated-db.mjs)"
          npm ci --ignore-scripts
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          npx playwright install --with-deps chromium
      - name: Inspect existing TEST checkout and canonical rows without mutation
        env:
          STAGE_SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGE_SUPABASE_ACCESS_TOKEN }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          PICKLA_DIAGNOSE_BROWSER: "true"
          PICKLA_DIAGNOSE_FILL: "true"
        run: node scripts/release-stripe-readonly-diagnostic.mjs
