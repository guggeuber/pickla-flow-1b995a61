name: Pickla release inspect
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full candidate commit SHA
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: pickla-release-registry-v1
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Inspect candidate with trusted main policy
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          git fetch origin "$CANDIDATE_SHA"
          node scripts/pickla-release.mjs inspect "$CANDIDATE_SHA"
          node scripts/release-registry-sync.mjs
